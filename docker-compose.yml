services:
  everfit-ai-coach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: everfit-ai-coach
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CHROMA_DIR: /app/data/chroma
      KB_DIR: /app/data/kb
      WORKOUT_HISTORY_PATH: /app/data/workout-history.json
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./EVALUATION.md:/app/EVALUATION.md
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s